<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sanctum — Encrypted Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== BASE STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Crimson Text', serif;
            background: #0a0806;
            color: #d4c5a9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(60, 40, 20, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(60, 40, 20, 0.25) 0%, transparent 60%);
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #120e0a; }
        ::-webkit-scrollbar-thumb { background: #6b5a45; border-radius: 3px; }

        .back-link {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            color: #6b5a45; text-decoration: none; font-size: 14px; letter-spacing: 2px;
            font-family: 'Cinzel', serif; transition: color 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .back-link:hover { color: #c9a96e; }

        #particles-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }

        /* ===== CARD STYLES ===== */
        .container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }

        .card {
            background: linear-gradient(145deg, rgba(20, 16, 12, 0.97), rgba(14, 11, 8, 0.97));
            border: 1px solid rgba(107, 90, 69, 0.3);
            border-radius: 16px;
            padding: 45px 35px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .card-header { text-align: center; margin-bottom: 30px; }
        .card-header .icon { font-size: 28px; color: #c9a96e; margin-bottom: 8px; }
        .card-header h1 { font-family: 'Cinzel', serif; font-size: 22px; color: #c9a96e; letter-spacing: 4px; text-transform: uppercase; }
        .card-header p { color: #6b5a45; font-style: italic; font-size: 14px; margin-top: 4px; }
        .card-header .enc-badge {
            display: inline-block; margin-top: 12px; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; color: #4a7a5a; border: 1px solid rgba(74,122,90,0.3);
            padding: 4px 14px; border-radius: 20px; font-family: 'Cinzel', serif;
        }

        /* ===== TABS & FORMS ===== */
        .tabs { display: flex; border-bottom: 1px solid rgba(107,90,69,0.2); margin-bottom: 25px; }
        .tab {
            flex: 1; text-align: center; padding: 10px 0; cursor: pointer;
            font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 2px;
            text-transform: uppercase; color: #6b5a45; transition: all 0.3s; border-bottom: 2px solid transparent;
        }
        .tab.active { color: #c9a96e; border-bottom-color: #c9a96e; }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeInUp 0.4s ease forwards; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #a09080; margin-bottom: 6px; letter-spacing: 1px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6b5a45; }
        
        input {
            width: 100%; padding: 12px 14px 12px 42px;
            background: rgba(10,8,6,0.6); border: 1px solid rgba(107,90,69,0.25);
            border-radius: 8px; color: #d4c5a9; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #c9a96e; box-shadow: 0 0 15px rgba(201,169,110,0.08); }

        .password-strength { height: 3px; background: rgba(107,90,69,0.15); border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .password-strength .bar { height: 100%; width: 0%; transition: 0.3s; }

        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 3px;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            background: linear-gradient(135deg, #8b7355, #6b5a45); color: #d4c5a9;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(107,90,69,0.2); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .security-note {
            margin-top: 20px; padding: 12px 16px; background: rgba(74,122,90,0.06);
            border: 1px solid rgba(74,122,90,0.15); border-radius: 8px; font-size: 12px;
            color: #6b8a6a; line-height: 1.6;
        }

        .error-msg { color: #a04040; font-size: 13px; margin-top: 8px; text-align: center; min-height: 20px; }
        .success-msg { color: #4a8a5a; font-size: 13px; margin-top: 8px; text-align: center; }

        /* ===== DASHBOARD VIEW ===== */
        .dashboard { display: none; }
        .dashboard.active { display: block; animation: fadeInUp 0.4s ease forwards; }
        .user-info { background: rgba(201,169,110,0.04); border: 1px solid rgba(201,169,110,0.12); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .user-info .field { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(107,90,69,0.08); font-size: 14px; }
        .logout-btn { background: transparent; border: 1px solid rgba(107,90,69,0.3); color: #6b5a45; margin-top: 10px; }
        .logout-btn:hover { border-color: #a04040; color: #a04040; }

        .spinner {
            display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(212,197,169,0.2);
            border-top-color: #d4c5a9; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> Back to Nexus</a>

    <div class="container">
        <div class="card">
            <!-- AUTH VIEW -->
            <div id="authView">
                <div class="card-header">
                    <div class="icon"><i class="fas fa-shield-halved"></i></div>
                    <h1>The Sanctum</h1>
                    <p>Enter the encrypted gateway</p>
                    <div class="enc-badge"><i class="fas fa-lock"></i> Zero-Knowledge Encrypted</div>
                </div>

                <div class="tabs">
                    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
                    <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
                </div>

                <!-- Login -->
                <div class="form-panel active" id="loginPanel">
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-wrap"><i class="fas fa-user"></i><input type="text" id="loginUser" placeholder="Username..."></div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap"><i class="fas fa-key"></i><input type="password" id="loginPass" placeholder="Password..."></div>
                    </div>
                    <div class="error-msg" id="loginError"></div>
                    <button class="btn" id="loginBtn" onclick="handleLogin()">Enter Sanctum</button>
                </div>

                <!-- Register -->
                <div class="form-panel" id="registerPanel">
                    <div class="form-group">
                        <label>Choose Username</label>
                        <div class="input-wrap"><i class="fas fa-user"></i><input type="text" id="regUser" placeholder="Username..."></div>
                    </div>
                    <div class="form-group">
                        <label>Choose Password</label>
                        <div class="input-wrap"><i class="fas fa-key"></i><input type="password" id="regPass" placeholder="Password..." oninput="checkStrength(this.value)"></div>
                        <div class="password-strength"><div class="bar" id="strengthBar"></div></div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrap"><i class="fas fa-key"></i><input type="password" id="regPassConfirm" placeholder="Confirm..."></div>
                    </div>
                    <div class="error-msg" id="regError"></div>
                    <div class="success-msg" id="regSuccess"></div>
                    <button class="btn" id="registerBtn" onclick="handleRegister()">Create Account</button>
                </div>

                <div class="security-note">
                    <i class="fas fa-shield"></i> <strong>Zero-Knowledge:</strong> Your password never leaves this device. All data is AES-256-GCM encrypted.
                </div>
            </div>

            <!-- DASHBOARD VIEW -->
            <div class="dashboard" id="dashboardView">
                <div class="card-header">
                    <div class="icon"><i class="fas fa-dragon"></i></div>
                    <h1>Welcome Back</h1>
                    <p>Identity Authenticated</p>
                </div>
                <div class="user-info">
                    <div class="field"><span>Username</span><span id="dashUser">—</span></div>
                    <div class="field"><span>Role</span><span id="dashRole" style="text-transform:uppercase; color:#c9a96e;">—</span></div>
                    <div class="field"><span>Session</span><span style="color:#4a8a5a;">Active</span></div>
                </div>
                <button class="btn logout-btn" onclick="handleLogout()">Leave Sanctum</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'sanctum_users';
        const SESSION_KEY = 'sanctum_session_persistent';
        const PBKDF2_ITERATIONS = 600000;

        // --- CRYPTO ENGINE ---
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
                keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plaintext, password, salt) {
            const key = await deriveKey(password, salt);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext));
            return { iv, ciphertext: new Uint8Array(ciphertext) };
        }

        async function decryptData(ciphertext, password, salt, iv) {
            const key = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
            return new TextDecoder().decode(decrypted);
        }

        const b64 = {
            encode: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
            decode: str => new Uint8Array(atob(str).split("").map(c => c.charCodeAt(0)))
        };

        // --- LOGIC ---
        function getStoredUsers() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }

        async function registerUser(username, password) {
            const users = getStoredUsers();
            if (users[username.toLowerCase()]) throw new Error('Username taken.');
            const role = Object.keys(users).length === 0 ? 'admin' : 'user';
            const payload = JSON.stringify({ username, role, createdAt: new Date().toISOString() });
            const salt = crypto.getRandomValues(new Uint8Array(32));
            const { iv, ciphertext } = await encryptData(payload, password, salt);
            users[username.toLowerCase()] = { salt: b64.encode(salt), iv: b64.encode(iv), data: b64.encode(ciphertext) };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        async function authenticateUser(username, password) {
            const users = getStoredUsers();
            const record = users[username.toLowerCase()];
            if (!record) throw new Error('User not found.');
            try {
                const plaintext = await decryptData(b64.decode(record.data), password, b64.decode(record.salt), b64.decode(record.iv));
                return JSON.parse(plaintext);
            } catch { throw new Error('Wrong password.'); }
        }

        // --- UI ---
        function switchTab(tab) {
            document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
            document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        }

        function checkStrength(val) {
            const bar = document.getElementById('strengthBar');
            let s = val.length * 10;
            bar.style.width = Math.min(s, 100) + '%';
            bar.style.background = s < 50 ? '#6b5a45' : s < 80 ? '#b8860b' : '#4a8a5a';
        }

        async function handleRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const btn = document.getElementById('registerBtn');
            if (!u || p.length < 8) { document.getElementById('regError').innerText = "Min 8 chars pass."; return; }
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
            try {
                await registerUser(u, p);
                document.getElementById('regSuccess').innerText = "Created! Redirecting...";
                setTimeout(() => switchTab('login'), 1500);
            } catch (e) { document.getElementById('regError').innerText = e.message; }
            finally { btn.disabled = false; btn.innerHTML = "Create Account"; }
        }

        async function handleLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
            try {
                const data = await authenticateUser(u, p);
                localStorage.setItem(SESSION_KEY, JSON.stringify({ user: data, lastActive: Date.now() }));
                showDashboard(data);
                startHeartbeat();
            } catch (e) { document.getElementById('loginError').innerText = e.message; }
            finally { btn.disabled = false; btn.innerHTML = "Enter Sanctum"; }
        }

        function showDashboard(data) {
            document.getElementById('authView').style.display = 'none';
            document.getElementById('dashboardView').classList.add('active');
            document.getElementById('dashUser').innerText = data.username;
            document.getElementById('dashRole').innerText = data.role;
        }

        function handleLogout() {
            localStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        // --- HEARTBEAT ---
        function startHeartbeat() {
            setInterval(() => {
                const s = JSON.parse(localStorage.getItem(SESSION_KEY));
                if (s) { s.lastActive = Date.now(); localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
            }, 10000);
        }

        window.addEventListener('load', () => {
            const s = JSON.parse(localStorage.getItem(SESSION_KEY));
            if (s && Date.now() - s.lastActive < 60000) {
                showDashboard(s.user);
                startHeartbeat();
            } else { localStorage.removeItem(SESSION_KEY); }
        });

        // --- PARTICLES ---
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            class P {
                constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.vx = (Math.random()-0.5)*0.2; this.vy = (Math.random()-0.5)*0.2; }
                update() { this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
                draw() { ctx.beginPath(); ctx.arc(this.x,this.y,1,0,Math.PI*2); ctx.fillStyle="rgba(201,169,110,0.3)"; ctx.fill(); }
            }
            for(let i=0; i<50; i++) particles.push(new P());
            function anim() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(anim);
            }
            anim();
        })();
    </script>
</body>
</html>
