<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Memanggil logo dari folder di luarnya (pakai ../) -->
    <link rel="icon" type="image/png" href="../logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The High Council — Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Crimson Text', serif; background: #0a0806; color: #d4c5a9;
            min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(ellipse at center, rgba(60, 40, 20, 0.15) 0%, transparent 70%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #120e0a; }
        ::-webkit-scrollbar-thumb { background: #6b5a45; border-radius: 3px; }

        /* Header / Nav */
        header {
            background: rgba(10, 8, 6, 0.95); border-bottom: 1px solid rgba(201, 169, 110, 0.2);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .logo { font-family: 'Cinzel', serif; font-size: 20px; color: #c9a96e; letter-spacing: 2px; }
        .logo i { margin-right: 8px; }
        .nav-actions a {
            color: #8b7355; text-decoration: none; font-family: 'Cinzel', serif; font-size: 13px;
            letter-spacing: 1px; transition: color 0.3s; margin-left: 20px;
        }
        .nav-actions a:hover { color: #c9a96e; }

        /* Main Container */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
        
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { font-family: 'Cinzel', serif; font-size: 32px; color: #c9a96e; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 15px rgba(201,169,110,0.2); }
        .page-title p { color: #6b5a45; font-style: italic; font-size: 16px; margin-top: 5px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background: rgba(20, 16, 12, 0.8); border: 1px solid rgba(107, 90, 69, 0.3);
            border-radius: 12px; padding: 20px; text-align: center;
        }
        .stat-card i { font-size: 24px; color: #c9a96e; margin-bottom: 10px; }
        .stat-card h3 { font-family: 'Cinzel', serif; font-size: 14px; color: #8b7355; letter-spacing: 2px; }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #d4c5a9; margin-top: 5px; font-family: 'Cinzel', serif; }

        /* Users Table / Grid */
        .panel {
            background: rgba(20, 16, 12, 0.9); border: 1px solid rgba(107, 90, 69, 0.3);
            border-radius: 12px; padding: 25px;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(107, 90, 69, 0.2); padding-bottom: 15px; margin-bottom: 20px; }
        .panel-header h2 { font-family: 'Cinzel', serif; font-size: 18px; color: #c9a96e; letter-spacing: 2px; }
        .btn-danger {
            background: rgba(160, 64, 64, 0.1); border: 1px solid rgba(160, 64, 64, 0.4);
            color: #ff6b6b; padding: 6px 15px; border-radius: 6px; font-family: 'Cinzel', serif;
            font-size: 11px; cursor: pointer; letter-spacing: 1px; transition: all 0.3s;
        }
        .btn-danger:hover { background: rgba(160, 64, 64, 0.3); color: #fff; box-shadow: 0 0 10px rgba(160,64,64,0.4); }

        .user-card {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(107, 90, 69, 0.2);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
        }
        .user-card:last-child { margin-bottom: 0; }
        .user-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .user-header .username { font-family: 'Cinzel', serif; color: #c9a96e; font-size: 16px; letter-spacing: 1px; }
        .user-header .badge { background: rgba(74,122,90,0.1); color: #6b8a6a; border: 1px solid rgba(74,122,90,0.3); padding: 3px 10px; font-size: 10px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; }
        
        .code-block {
            background: #050403; border: 1px solid #2a221a; border-radius: 6px;
            padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: #8b7355; word-break: break-all; margin-top: 8px; line-height: 1.5;
        }
        .code-block span { color: #5a4a3a; display: block; margin-bottom: 3px; }

        .empty-state { text-align: center; padding: 40px 0; color: #6b5a45; font-style: italic; }

        /* Loader Overlay */
        #page-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0806;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
        #page-loader i { font-size: 40px; color: #c9a96e; animation: spin 2s linear infinite; margin-bottom: 20px; }
        #page-loader p { font-family: 'Cinzel', serif; color: #8b7355; letter-spacing: 3px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Layar Pengecekan Keamanan -->
    <div id="page-loader">
        <i class="fas fa-compass"></i>
        <p>Verifying Admin Privileges...</p>
    </div>

    <!-- Konten Utama (Disembunyikan sebelum diverifikasi) -->
    <div id="admin-content" style="display: none;">
        <header>
            <div class="logo"><i class="fas fa-eye"></i> The High Council</div>
            <div class="nav-actions">
                <!-- Arahkan kembali ke luar folder (../) -->
                <a href="../index.html"><i class="fas fa-home"></i> Return to Nexus</a>
                <a href="../login.html"><i class="fas fa-door-open"></i> The Sanctum</a>
            </div>
        </header>

        <div class="container">
            <div class="page-title">
                <h1>Admin Vault</h1>
                <p>Oversight of the Encrypted Souls</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <h3>Registered Souls</h3>
                    <div class="number" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-shield-halved"></i>
                    <h3>Encryption Engine</h3>
                    <div class="number" style="font-size: 18px; line-height: 48px; color: #4a8a5a;">AES-256-GCM</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fas fa-database"></i> Encrypted Records</h2>
                    <button class="btn-danger" onclick="purgeDatabase()"><i class="fas fa-fire"></i> Purge All Records</button>
                </div>
                <div id="usersContainer">
                    <!-- Data user akan di-render di sini oleh JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SISTEM PROTEKSI HALAMAN & RENDER DATA
        // ==========================================

        // 1. Fungsi detak jantung khusus halaman Admin (Terpisah di luar agar rapi)
        function updateHeartbeat() {
            const sessionStr = localStorage.getItem('sanctum_session_persistent');
            if (sessionStr) {
                const session = JSON.parse(sessionStr);
                session.lastActive = Date.now();
                localStorage.setItem('sanctum_session_persistent', JSON.stringify(session));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('page-loader');
            const content = document.getElementById('admin-content');

            // 2. Cek apakah ada Sesi Login yang Aktif
            const activeSessionStr = localStorage.getItem('sanctum_session_persistent');
            
            setTimeout(() => {
                if (!activeSessionStr) {
                    // Jika belum login sama sekali, tendang ke login.html
                    alert("ACCESS DENIED: You must authenticate in The Sanctum first.");
                    window.location.href = '../login.html'; 
                    return;
                }
                
                // Decode data sesi login
                const session = JSON.parse(activeSessionStr);

                // 3. Proteksi Hak Akses Admin
                if (session.user.role !== 'admin') {
                    alert("ACCESS DENIED: Only the Arch-Admin (The High Council) can enter this vault.");
                    window.location.href = '../index.html'; // Usir ke halaman utama
                    return;
                }

                // Jika lolos verifikasi sebagai Admin
                loader.style.display = 'none';
                content.style.display = 'block';
                loadAdminData();

                // Jaga sesi agar tetap hidup selama sedang membuka halaman Admin
                updateHeartbeat();
                setInterval(updateHeartbeat, 10000);

            }, 1000); // Delay pemuatan visual
        });

        // 2. Fungsi Memuat Data dari Database Lokal Browser
        function loadAdminData() {
            const container = document.getElementById('usersContainer');
            const totalText = document.getElementById('totalUsers');
            
            // Ambil data users (yang dienkripsi)
            const usersObj = JSON.parse(localStorage.getItem('sanctum_users') || '{}');
            const usernames = Object.keys(usersObj);
            
            totalText.innerText = usernames.length;

            if (usernames.length === 0) {
                container.innerHTML = '<div class="empty-state">The vault is empty. No souls have registered yet.</div>';
                return;
            }

            let html = '';
            usernames.forEach(user => {
                const record = usersObj[user];
                // Hitung estimasi ukuran byte
                const byteSize = Math.round((record.data.length * 0.75) / 1024 * 10) / 10;

                html += `
                <div class="user-card">
                    <div class="user-header">
                        <div class="username"><i class="fas fa-user-secret"></i> Entity: ${user.toUpperCase()}</div>
                        <div class="badge">Payload: ${byteSize} KB</div>
                    </div>
                    <div class="code-block">
                        <span>// Initialization Vector (IV)</span>
                        ${record.iv}
                    </div>
                    <div class="code-block">
                        <span>// Ciphertext (Zero-Knowledge AES Payload)</span>
                        ${record.data}
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // 3. Fungsi Menghapus Seluruh Database
        function purgeDatabase() {
            const confirmPurge = confirm("WARNING: This will destroy all registered accounts and encrypted data permanently. Are you sure?");
            if (confirmPurge) {
                // Hapus data user dan paksa logout
                localStorage.removeItem('sanctum_users');
                localStorage.removeItem('sanctum_session_persistent');
                
                alert("The vault has been purged. You will be logged out.");
                window.location.href = '../login.html';
            }
        }
    </script>
</body>
</html>
